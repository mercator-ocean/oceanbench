name: Run tests
on: [push]
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: mamba-org/setup-micromamba@v1
        with:
          micromamba-version: '1.5.6-0'
          micromamba-binary-path: ${{ runner.temp }}/bin/micromamba
          environment-file: conda_environment_test.yaml
          environment-name: oceanbench_test_${{ github.ref_name }}_${{ github.sha }}
          condarc-file: .condarc
          cache-environment: true
          post-cleanup: 'all'
      - name: Install package
        run: pip install --editable .
        shell: micromamba-shell {0}
      - name: Run unit tests
        env:
          TEST_ENVIRONMENT_NAME: oceanbench_test_${{ github.ref_name }}_${{ github.sha }}
        run: poetry run pytest tests -n 8
        shell: micromamba-shell {0}
