name: Evaluate samples
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Nightly at 02:00 UTC
    - cron: '0 2 * * *'
concurrency:
  group: evaluate-samples-${{ github.ref }}
  cancel-in-progress: true
jobs:
  evaluate-sample:
    name: evaluate ${{ matrix.sample }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        sample:
          - glo36v1
          - glonet_1_degree
          - glonet
          - langya
          - wenhai
          - xihe
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Record host resources
        run: |
          echo "cpus: $(nproc)"
          free -h
          df -h / /mnt || true
      - name: Start memory sampler
        run: |
          cat > /tmp/memwatch.sh <<'SAMPLER'
          #!/usr/bin/env bash
          peak_used=0
          peak_swap=0
          while true; do
            used=$(free -m | awk '/^Mem:/{print $3}')
            swap=$(free -m | awk '/^Swap:/{print $3}')
            [ "$used" -gt "$peak_used" ] && peak_used=$used
            [ "$swap" -gt "$peak_swap" ] && peak_swap=$swap
            echo "$(date -u +%H:%M:%S) used=${used}MB swap=${swap}MB peak_used=${peak_used}MB peak_swap=${peak_swap}MB"
            echo "$peak_used $peak_swap" > /tmp/mem_peak
            sleep 30
          done
          SAMPLER
          chmod +x /tmp/memwatch.sh
          nohup /tmp/memwatch.sh > /tmp/memwatch.log 2>&1 &
          echo $! > /tmp/memwatch.pid
      - uses: mamba-org/setup-micromamba@v1
        with:
          micromamba-version: '1.5.6-0'
          micromamba-binary-path: ${{ runner.temp }}/bin/micromamba
          environment-file: conda_environment_test.yaml
          environment-name: oceanbench_test_${{ github.sha }}
          condarc-file: .condarc
          cache-environment: true
          post-cleanup: 'all'
      - name: Install package
        run: pip install --editable .
        shell: micromamba-shell {0}
      - name: Evaluate sample
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_S3_ENDPOINT: ${{ secrets.AWS_S3_ENDPOINT }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          TEST_ENVIRONMENT_NAME: oceanbench_test_${{ github.sha }}
        run: /usr/bin/time -v make evaluate-sample SAMPLE=assets/${{ matrix.sample }}_sample.py
        shell: micromamba-shell {0}
      - name: Report peak memory
        if: always()
        run: |
          kill "$(cat /tmp/memwatch.pid)" 2>/dev/null || true
          echo "=== memory samples (30s interval) ==="
          cat /tmp/memwatch.log || echo "no samples"
          if [ -f /tmp/mem_peak ]; then
            read -r pu ps < /tmp/mem_peak
            echo "=== PEAK used=${pu}MB  PEAK swap=${ps}MB  (runner: $(free -m | awk '/^Mem:/{print $2}')MB RAM + $(free -m | awk '/^Swap:/{print $2}')MB swap) ==="
          fi
      - name: Compare generated notebook against reference
        env:
          TEST_ENVIRONMENT_NAME: oceanbench_test_${{ github.sha }}
        run: make compare-sample SAMPLE=assets/${{ matrix.sample }}_sample.py
        shell: micromamba-shell {0}
      - name: Archive generated notebooks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-notebook-${{ matrix.sample }}
          path: |
            ${{ matrix.sample }}_sample.*.report.ipynb
  evaluate-extras:
    name: evaluate ibi region, notebooks and doctests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Record host resources
        run: nproc && free -h
      - uses: mamba-org/setup-micromamba@v1
        with:
          micromamba-version: '1.5.6-0'
          micromamba-binary-path: ${{ runner.temp }}/bin/micromamba
          environment-file: conda_environment_test.yaml
          environment-name: oceanbench_test_${{ github.sha }}
          condarc-file: .condarc
          cache-environment: true
          post-cleanup: 'all'
      - name: Install package
        run: pip install --editable .
        shell: micromamba-shell {0}
      - name: Evaluate IBI region sample
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_S3_ENDPOINT: ${{ secrets.AWS_S3_ENDPOINT }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          TEST_ENVIRONMENT_NAME: oceanbench_test_${{ github.sha }}
        run: make evaluate-ibi-region
        shell: micromamba-shell {0}
      - name: Compare IBI notebook against reference
        env:
          TEST_ENVIRONMENT_NAME: oceanbench_test_${{ github.sha }}
        run: make compare-ibi
        shell: micromamba-shell {0}
      - name: Run dataset doctests
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_S3_ENDPOINT: ${{ secrets.AWS_S3_ENDPOINT }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          TEST_ENVIRONMENT_NAME: oceanbench_test_${{ github.sha }}
        run: make doctest
        shell: micromamba-shell {0}
      - name: Archive generated notebooks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-notebook-ibi
          path: |
            *.ibi.report.ipynb
